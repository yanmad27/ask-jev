name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in hooks/*.mjs lib/*.mjs bin/*.mjs; do node --check "$f"; done

      - name: Manifest JSON validity
        run: node -e "['hooks/hooks.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json'].forEach(f=>JSON.parse(require('fs').readFileSync(f,'utf8')))"

      - name: Unit tests
        run: node --test hooks/*.test.mjs

      - name: Hook contract - missing description denies
        run: |
          out=$(echo '{"tool_name":"AskUserQuestion","transcript_path":"/dev/null","tool_input":{"questions":[{"question":"Q?","options":[{"label":"A"},{"label":"B","description":"b"}]}]}}' | TYPESAFE_API_KEY=dummy node hooks/ask-jev.mjs)
          echo "$out" | grep -q '"permissionDecision":"deny"'

      - name: Hook contract - resolved context stays silent
        run: |
          out=$(echo '{"tool_name":"AskUserQuestion","transcript_path":"/dev/null","tool_input":{"questions":[{"question":"Q?","options":[{"label":"A","description":"a"},{"label":"B","description":"b"}]}]}}' | TYPESAFE_API_KEY=dummy node hooks/ask-jev.mjs)
          [ -z "$out" ]

      - name: SessionStart rule - with key
        run: |
          out=$(echo '{}' | TYPESAFE_API_KEY=dummy node hooks/session-start.mjs)
          echo "$out" | grep -q additionalContext

      - name: SessionStart rule - without key
        run: |
          out=$(echo '{}' | env -u TYPESAFE_API_KEY -u AI_GATEWAY_API_KEY HOME=/tmp/nohome node hooks/session-start.mjs)
          [ -z "$out" ]

  paseo-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-plugin/package-lock.json

      - name: Install
        working-directory: paseo-plugin
        run: npm ci

      - name: Build (typecheck)
        working-directory: paseo-plugin
        run: npm run build

      - name: shared/stats.mjs matches ../lib/stats.mjs
        run: git diff --exit-code paseo-plugin/shared/stats.mjs
